<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
	<!--
		La foto de perfil, la misma que sale en la página, recortada en redondo.

		El JPEG va incrustado y no enlazado porque un favicon SVG se pinta como
		imagen suelta, sin documento alrededor: no hay origen contra el que
		resolver una ruta relativa, y las peticiones externas desde dentro de un
		favicon no las hace ningún navegador.
	-->
	<clipPath id="redondo"><circle cx="100" cy="100" r="100" /></clipPath>
	<image href="data:image/jpeg;base64," width="200" height="200" clip-path="url(#redondo)" />
</svg>
